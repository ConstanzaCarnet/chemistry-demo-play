<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Seguridad: solo scripts propios, sin eval, sin conexiones de red salvo Google Fonts -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Química Quest</title>
  <meta name="description" content="Juego para estudiar reacciones químicas y estequiometría (nivel secundario).">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚗️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo">⚗️</span><span class="txt">Química <b>Quest</b></span></a>
    <div class="top-stats">
      <span class="chip level" id="lvl">Nv 1</span>
      <div class="xpbar" title="Progreso al siguiente nivel"><i id="xpbar" style="width:0"></i></div>
      <span class="chip" id="xpnum">0 XP</span>
      <span class="chip streak" id="streak" title="Racha de respuestas correctas al primer intento">🔥 0</span>
      <button class="icon-btn" id="soundBtn" title="Sonido">🔊</button>
      <button class="icon-btn" id="themeBtn" title="Modo claro / oscuro">🌓</button>
    </div>
  </header>

  <main id="app"></main>
  <footer>Química Quest · Reacciones químicas y Estequiometría · 6° año</footer>

  <div class="toasts" id="toasts"></div>
  <canvas id="confetti"></canvas>

  <script src="js/security.js"></script>
  <script src="js/chem.js"></script>
  <script src="js/data.js"></script>
  <script src="js/generators.js"></script>
  <script src="js/labs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
